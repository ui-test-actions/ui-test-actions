name: Android startup diagnostics research
on:
  push:
    branches: [research/android-startup-diagnostics-20261121]
permissions:
  contents: read
jobs:
  diagnostics:
    if: false
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Boot emulator and classify independent fixture exits
        env:
          API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          sudo chmod a+rw /dev/kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          image="system-images;android-${API};google_apis;x86_64"
          "$tools/sdkmanager" --install emulator platform-tools "$image" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_USER_HOME="$HOME/.android"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/startup-avds"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          adb start-server
          "$tools/avdmanager" create avd --force --name startup-fixture --path "$ANDROID_AVD_HOME/startup-fixture.avd" --package "$image" <<< no
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx startup-fixture
          "$ANDROID_HOME/emulator/emulator" -avd startup-fixture -port 5554 -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/proof/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 360 bash -c 'until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do kill -0 "$1" || exit 1; sleep 2; done' bash "$emulator_pid"
          adb -s emulator-5554 shell wm dismiss-keyguard
          bash fixtures/android-startup/run-fixture.sh emulator-5554 "$RUNNER_TEMP/proof"
      - name: Retain fixture diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-startup-api-${{ matrix.api }}
          path: ${{ runner.temp }}/proof
          retention-days: 7
  signed-archive-offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 36
            runner: ubuntu-24.04
            abi: x86_64
            recording: enabled
          - api: 36
            runner: ubuntu-24.04
            abi: x86_64
            recording: disabled
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Boot disposable Google Play emulator and capture offline launch
        env:
          API: ${{ matrix.api }}
          ABI: ${{ matrix.abi }}
          RECORDING: ${{ matrix.recording }}
          ARCHIVE_URL: ${{ secrets.ANDROID_STARTUP_RESEARCH_XAPK_URL }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/target-proof"
          mkdir -p "$proof" "$RUNNER_TEMP/archive"
          { uname -m; ls -l /dev/kvm; } > "$proof/host.txt" 2>&1 || true
          cd "$RUNNER_TEMP/archive"
          curl --fail --silent --max-time 180 --location "$ARCHIVE_URL" --output target.xapk
          echo '187a7884900fe182dcf32112f578e0130fb2a8defb682c701182c0ec01f68578  target.xapk' | sha256sum -c
          unzip -j target.xapk com.emeint.android.myservices.apk config.arm64_v8a.apk config.mdpi.apk
          sudo chmod a+rw /dev/kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          image="system-images;android-${API};google_apis_playstore;${ABI}"
          yes | "$tools/sdkmanager" --licenses > "$proof/sdk-licenses.txt" || true
          "$tools/sdkmanager" --install emulator platform-tools "$image"
          export ANDROID_USER_HOME="$HOME/.android"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/target-avds"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          adb start-server
          "$tools/avdmanager" create avd --force --name target-lab --path "$ANDROID_AVD_HOME/target-lab.avd" --package "$image" <<< no
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx target-lab
          accel=on
          if [[ "$ABI" == arm64-v8a && "$(uname -m)" == x86_64 ]]; then accel=off; fi
          "$ANDROID_HOME/emulator/emulator" -no-window -version > "$proof/emulator-version.txt" 2>&1 || true
          "$ANDROID_HOME/emulator/emulator" -avd target-lab -accel "$accel" -port 5554 -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$proof/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 360 bash -c 'until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do kill -0 "$1" || exit 1; sleep 2; done' bash "$emulator_pid"
          device=(adb -s emulator-5554)
          "${device[@]}" shell wm dismiss-keyguard
          "${device[@]}" shell cmd connectivity airplane-mode enable > "$proof/offline.txt" 2>&1
          "${device[@]}" shell svc wifi disable >> "$proof/offline.txt" 2>&1
          "${device[@]}" shell svc data disable >> "$proof/offline.txt" 2>&1
          "${device[@]}" shell 'settings get global airplane_mode_on; cmd wifi status; dumpsys connectivity | grep "Active default network"' >> "$proof/offline.txt" 2>&1 || true
          "${device[@]}" shell 'getprop ro.build.version.sdk; getprop ro.product.cpu.abilist; getprop ro.dalvik.vm.native.bridge; getprop ro.boot.verifiedbootstate; id' > "$proof/device.txt"
          "${device[@]}" install-multiple com.emeint.android.myservices.apk config.arm64_v8a.apk config.mdpi.apk 2>&1 | tee "$proof/install.txt"
          pkg=com.emeint.android.myservices
          "${device[@]}" shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$pkg" > "$proof/resolved-activity.txt"
          component=$(tr -d '\r' < "$proof/resolved-activity.txt" | tail -1)
          capture="$GITHUB_WORKSPACE/fixtures/android-startup/capture.sh"
          for trial in 1 2; do
            if [[ "$RECORDING" == enabled ]]; then
              "${device[@]}" shell screenrecord --time-limit 12 "/sdcard/startup-$trial.mp4" > "$proof/recording-$trial.txt" 2>&1 &
              recorder=$!
            fi
            raw="$RUNNER_TEMP/raw-target-$trial"
            bash "$capture" emulator-5554 "$pkg" "$component" "$raw"
            mkdir -p "$proof/trial-$trial"
            trial_out="$proof/trial-$trial"
            cp "$raw"/{launch.txt,pid-*.txt,exit-*.txt,*-utc.txt,screen.png} "$trial_out/"
            if [[ "$RECORDING" == enabled ]]; then
              wait "$recorder" || true
              "${device[@]}" pull "/sdcard/startup-$trial.mp4" "$trial_out/startup.mp4" > "$trial_out/recording.txt" 2>&1 || true
            fi
            grep -Ei 'emeint\.android\.myservices|vodafone\.vis\.engezly|pairip|licenseclient|licenseservice|libd26f|zygote.*[Ff]ail' "$raw/logcat.txt" > "$trial_out/logcat-scoped.txt" || true
            grep -Ei 'emeint\.android\.myservices|topResumedActivity' "$raw/activities.txt" > "$trial_out/activities-scoped.txt" || true
            "${device[@]}" logcat -d -b crash -v threadtime > "$trial_out/crash-buffer.txt"
            "${device[@]}" shell dumpsys dropbox --print data_app_native_crash > "$raw/dropbox.txt"
            awk -v RS='========================================' '/com[.]emeint[.]android[.]myservices/' "$raw/dropbox.txt" > "$trial_out/native-dropbox.txt"
            "${device[@]}" shell dumpsys dropbox --print data_app_anr > "$raw/anr.txt"
            awk -v RS='========================================' '/com[.]emeint[.]android[.]myservices/' "$raw/anr.txt" > "$trial_out/anr-dropbox.txt"
            python3 - "$raw/logcat.txt" "$trial_out/target-process-logcat.txt" <<'PYTHON'
          import pathlib
          import re
          import sys
          source = pathlib.Path(sys.argv[1]).read_text()
          pids = set(re.findall(r'am_proc_start: \[0,(\d+),\d+,com[.]emeint[.]android[.]myservices,', source))
          output = []
          for line in source.splitlines():
              parts = line.split()
              if len(parts) > 3 and parts[2] in pids:
                  output.append(line)
          pathlib.Path(sys.argv[2]).write_text("\n".join(output) + "\n")
          PYTHON
          done
      - name: Retain scoped launch diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-archive-offline-api-${{ matrix.api }}-${{ matrix.abi }}-${{ matrix.recording }}
          path: ${{ runner.temp }}/target-proof
          retention-days: 7
