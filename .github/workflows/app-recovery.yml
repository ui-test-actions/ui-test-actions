name: Verify desktop process recovery
run-name: Desktop process recovery · ${{ inputs.target }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [linux, windows, macos]
        required: true
      token_sha256:
        description: SHA-256 digest of the private external test session token
        type: string
        required: true
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ${{ fromJSON('{"linux":"ubuntu-24.04","windows":"windows-2025","macos":"macos-15"}')[inputs.target] }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Tk from Ubuntu if needed
        if: inputs.target == 'linux'
        run: sudo apt-get install -y --no-install-recommends python3-tk
      - uses: ui-test-actions/ui-test-actions@93b2fca6902a8d4a8febac847a59194c68a78f17
        with:
          target: ${{ inputs.target }}
          token-sha256: ${{ inputs.token_sha256 }}
          duration-minutes: '6'
          display-size: 1024x768
          desktop-apps: >-
            {"fixture":{"argv":["${{ inputs.target == 'linux' && '/usr/bin/python3' || 'python' }}","fixtures/desktop.py","fixture-recovery-ready","12"]}}
