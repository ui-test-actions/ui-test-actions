name: Verify advanced desktop interactions
run-name: Desktop interactions · ${{ inputs.target }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [linux, windows, macos]
        required: true
      token_sha256:
        description: SHA-256 digest of the client session token
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ fromJSON('{"linux":"ubuntu-24.04","windows":"windows-2025","macos":"macos-15"}')[inputs.target] }}
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Tk on Linux
        if: inputs.target == 'linux'
        run: sudo apt-get -o DPkg::Lock::Timeout=60 install -y python3-tk
      - uses: ui-test-actions/ui-test-actions@803d83d50713f845db414c30c7c826071ede907c
        with:
          target: ${{ inputs.target }}
          token-sha256: ${{ inputs.token_sha256 }}
          duration-minutes: '10'
          launch: |
            fixture_python=python
            if [[ "$RUNNER_OS" == Linux ]]; then fixture_python=/usr/bin/python3; fi
            "$fixture_python" fixtures/desktop_interactions.py interaction-evidence > interaction.log 2>&1 &
          ready: test -f interaction-evidence/ready
      - name: Check delivered native events independently of the client
        run: python fixtures/desktop_interactions.py interaction-evidence verify
        if: ${{ inputs.target != 'linux' }}
      - name: Check delivered native events on Ubuntu
        run: /usr/bin/python3 fixtures/desktop_interactions.py interaction-evidence verify
        if: ${{ inputs.target == 'linux' }}
      - name: Retain native event evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-native-events
          path: |
            interaction-evidence/events.json
            interaction.log
          if-no-files-found: ignore
          retention-days: 7
