name: Verify desktop UI session
run-name: Desktop proof · ${{ inputs.target }} · ${{ inputs.duration }}m
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [linux, windows, macos]
        required: true
      token_sha256:
        description: SHA-256 of the client session token
        type: string
        required: true
      duration:
        description: Minutes after app readiness
        type: string
        default: '10'
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ${{ fromJSON('{"linux":"ubuntu-24.04","windows":"windows-2025","macos":"macos-15"}')[inputs.target] }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Linux fixture dependency
        if: inputs.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - uses: ui-test-actions/ui-test-actions@3ce171874f2b3abe7334a31cbf7f6a81a8a1ca84
        with:
          target: ${{ inputs.target }}
          token-sha256: ${{ inputs.token_sha256 }}
          duration-minutes: ${{ inputs.duration }}
          file-exchange: '1'
          launch: |
            fixture_python=python
            if [[ "$RUNNER_OS" == Linux ]]; then fixture_python=/usr/bin/python3; fi
            "$fixture_python" fixtures/desktop.py fixture-ready > fixture.log 2>&1 &
          ready: test -f fixture-ready || { cat fixture.log >&2; false; }
