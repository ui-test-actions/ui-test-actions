name: Verify interaction recording and replay
run-name: Mousepad interaction workflow · ${{ inputs.phase }}
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [record, replay]
        required: true
      token_sha256:
        description: SHA-256 digest of the external agent token
        type: string
        required: true
permissions:
  contents: read
jobs:
  mousepad:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare the pinned real app and fresh document
        shell: bash
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=60 install -y --no-install-recommends \
            mousepad=0.6.1-1build2 fonts-noto-core xvfb xauth xdotool xclip openbox wmctrl \
            python3-pyatspi at-spi2-core dbus-x11
          sudo locale-gen ar_EG.UTF-8
          mkdir -p gtk-evidence
          printf 'Original GTK test document.\n' > gtk-evidence/document.txt
      - uses: ui-test-actions/ui-test-actions@07a58ce720fd28c8886abe0b5f8b30ff00044c54
        with:
          target: linux
          token-sha256: ${{ inputs.token_sha256 }}
          duration-minutes: '7'
          launch: |
            LANG=ar_EG.UTF-8 LC_ALL=ar_EG.UTF-8 LANGUAGE=ar mousepad "$PWD/gtk-evidence/document.txt" > gtk-evidence/app.log 2>&1 &
            printf '%s\n' "$!" > gtk-evidence/launcher.pid
          ready: kill -0 "$(cat gtk-evidence/launcher.pid)" && wmctrl -l | grep -Fq document.txt
      - name: Verify exact persisted content independently of the agent
        shell: bash
        env:
          TRACE_PHASE: ${{ inputs.phase }}
        run: |
          PYTHONPATH=verification/real-apps python - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path
          from verify import EXPECTED
          saved = Path("gtk-evidence/document.txt").read_bytes()
          assert saved.decode("utf-8-sig").removesuffix("\n") == EXPECTED
          evidence = {"phase": os.environ["TRACE_PHASE"], "app": "Mousepad 0.6.1-1build2",
                      "result": "passed", "sha256": sha256(saved).hexdigest()}
          Path("gtk-evidence/result.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interaction-trace-${{ inputs.phase }}
          path: gtk-evidence/result.json
          if-no-files-found: error
          retention-days: 7
