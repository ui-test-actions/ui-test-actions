name: Verify mobile UI session
run-name: Mobile proof · ${{ inputs.target }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [android, ios]
        required: true
      ios_runner:
        description: Hosted macOS image for the iOS simulator
        type: choice
        options: [macos-26, macos-15]
        default: macos-26
      token_sha256:
        description: SHA-256 of the client session token
        type: string
        required: true
      duration:
        description: Minutes after app readiness
        type: string
        default: '15'
      scenario:
        description: Enable environment mutation for the approved test fixture
        type: choice
        options: [session, environment]
        default: session
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ${{ inputs.target == 'android' && 'ubuntu-24.04' || inputs.ios_runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Boot Android emulator and build fixture
        if: inputs.target == 'android'
        shell: bash
        run: |
          sudo chmod a+rw /dev/kvm
          image='system-images;android-35;google_apis;x86_64'
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$tools/sdkmanager" emulator "$image" 'platforms;android-35' 'build-tools;35.0.0'
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/live-ui-avds"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          adb version
          adb start-server
          echo no | "$tools/avdmanager" create avd --force --name live-ui-proof --package "$image" --path "$ANDROID_AVD_HOME/live-ui-proof.avd"
          if ! "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fxq live-ui-proof; then
            "$tools/avdmanager" list avd
            exit 1
          fi
          "$ANDROID_HOME/emulator/emulator" -avd live-ui-proof -port 5554 -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
          emulator_pid=$!
          bash fixtures/android/build.sh build/android
          if ! timeout 360 bash -c 'until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do kill -0 "$1" || exit 1; sleep 2; done' bash "$emulator_pid"; then
            cat emulator.log
            exit 1
          fi
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          adb -s emulator-5554 shell wm dismiss-keyguard
          echo 'PROOF_DEVICE=emulator-5554' >> "$GITHUB_ENV"
      - name: Boot iOS simulator and build fixture
        if: inputs.target == 'ios'
        shell: bash
        run: |
          if [[ "${{ inputs.scenario }}" == environment ]]; then test "$(uname -m)" = arm64; fi
          xcodebuild -version
          xcrun simctl list devices available -j > simulators.json
          simulator=$(python -c '
          import json
          runtimes = json.load(open("simulators.json"))["devices"]
          print(next(
              device["udid"]
              for key in reversed(sorted(runtimes)) if ".iOS-" in key
              for device in runtimes[key]
              if device["name"].startswith("iPhone") and device["isAvailable"]
          ))
          ')
          bash fixtures/ios/build.sh "$RUNNER_TEMP/LiveUIFixture.app"
          xcrun simctl bootstatus "$simulator" -b
          echo "PROOF_DEVICE=$simulator" >> "$GITHUB_ENV"
      - name: Capture native Android permission diagnostics
        if: inputs.scenario == 'environment' && inputs.target == 'android'
        shell: bash
        run: |
          adb -s "$PROOF_DEVICE" install -r build/android/fixture.apk
          mkdir -p "$RUNNER_TEMP/android-environment"
          for phase in baseline granted denied; do
            case "$phase" in
              granted) adb -s "$PROOF_DEVICE" shell pm grant --user 0 dev.uitest.fixture android.permission.CAMERA ;;
              denied) adb -s "$PROOF_DEVICE" shell pm revoke --user 0 dev.uitest.fixture android.permission.CAMERA ;;
            esac
            state="$RUNNER_TEMP/android-environment/$phase.txt"
            adb -s "$PROOF_DEVICE" shell dumpsys package dev.uitest.fixture |
              grep -E 'User 0:|permissions:|android\.permission\.CAMERA' > "$state"
          done
          adb -s "$PROOF_DEVICE" uninstall dev.uitest.fixture
      - name: Retain scoped Android fixture diagnostics
        if: inputs.scenario == 'environment' && inputs.target == 'android'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-environment-permissions
          path: ${{ runner.temp }}/android-environment
          retention-days: 7
      - name: Sample scoped iOS fixture authorization records
        if: inputs.scenario == 'environment' && inputs.target == 'ios'
        shell: bash
        run: |
          xcrun simctl install "$PROOF_DEVICE" "$RUNNER_TEMP/LiveUIFixture.app"
          store="$HOME/Library/Developer/CoreSimulator/Devices/$PROOF_DEVICE/data/Library/TCC/TCC.db"
          mkdir -p "$RUNNER_TEMP/ios-environment"
          for service in photos microphone; do
            for state in grant revoke reset; do
              xcrun simctl privacy "$PROOF_DEVICE" "$state" "$service" dev.uitest.fixture
              record="$RUNNER_TEMP/ios-environment/$service-$state.txt"
              if [[ ! -r "$store" ]] || ! sqlite3 -readonly "$store" "SELECT service,auth_value FROM access WHERE client='dev.uitest.fixture';" > "$record"; then
                printf '%s\n' 'Fixture TCC database records unavailable.' > "$record"
              fi
            done
          done
      - name: Retain scoped iOS fixture diagnostics
        if: inputs.scenario == 'environment' && inputs.target == 'ios'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-environment-permissions
          path: ${{ runner.temp }}/ios-environment
          retention-days: 7
      - uses: ui-test-actions/ui-test-actions@77fffa0eac959dc008d36f59d194c23cb3b0432b
        with:
          target: ${{ inputs.target }}
          token-sha256: ${{ inputs.token_sha256 }}
          duration-minutes: ${{ inputs.duration }}
          device: ${{ env.PROOF_DEVICE }}
          app-ids: dev.uitest.fixture
          app-environment: ${{ inputs.scenario == 'environment' && (inputs.target == 'android' && '{"dev.uitest.fixture":["camera"]}' || '{"dev.uitest.fixture":["photos","microphone"]}') || '{}' }}
          deeplink-schemes: ui-test-fixture
          app-installs: >-
            {"dev.uitest.fixture":"${{ inputs.target == 'android' && format('{0}/build/android/fixture.apk', github.workspace) || format('{0}/LiveUIFixture.app', runner.temp) }}"}
          launch: |
            if [[ "$RUNNER_OS" == Linux ]]; then
              adb -s "$PROOF_DEVICE" install -r build/android/fixture.apk
              adb -s "$PROOF_DEVICE" shell am start -W -n dev.uitest.fixture/.MainActivity
            else
              xcrun simctl install "$PROOF_DEVICE" "$RUNNER_TEMP/LiveUIFixture.app"
              xcrun simctl launch "$PROOF_DEVICE" dev.uitest.fixture
            fi
          ready: |
            if [[ "$RUNNER_OS" == Linux ]]; then
              adb -s "$PROOF_DEVICE" shell dumpsys activity activities | grep -q 'mResumedActivity.*dev.uitest.fixture\|topResumedActivity.*dev.uitest.fixture'
            else
              xcrun simctl spawn "$PROOF_DEVICE" launchctl list | grep -q 'UIKitApplication:dev.uitest.fixture'
            fi
      - name: Check Android app settings were restored
        if: inputs.scenario == 'environment' && inputs.target == 'android'
        shell: bash
        run: |
          adb -s "$PROOF_DEVICE" shell cmd locale get-app-locales dev.uitest.fixture | grep -F ' are []'
          state=$(adb -s "$PROOF_DEVICE" shell dumpsys package dev.uitest.fixture)
          printf '%s\n' "$state" | grep -E '^[[:space:]]+android\.permission\.CAMERA([[:space:]]*$|:)'
          if [[ "$state" == *'android.permission.CAMERA: granted=true'* ]]; then exit 1; fi
