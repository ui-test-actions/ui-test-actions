name: Diagnose protected Named Tunnel route
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: named-ui-tunnel-uitest.abdelrahmanfahmy.dev
  cancel-in-progress: false
jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare authenticated and anonymous responses
        env:
          UI_TEST_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          UI_TEST_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          EXPECTED_ACCESS_ID_HASH: ${{ secrets.NAMED_ACCEPTANCE_CLIENT_ID_HASH }}
          UI_TEST_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: python verification/named-route-diagnostic.py
