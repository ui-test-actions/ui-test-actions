name: Verify a configured Named Tunnel
on:
  workflow_dispatch:
    inputs:
      hostname:
        type: string
        description: Dedicated Cloudflare-routed hostname for this verification
        required: true
      token_sha256:
        type: string
        description: SHA-256 digest of the test session bearer
        required: true
      duration:
        type: string
        description: Minutes after the app is ready
        default: '8'
permissions:
  contents: read
concurrency:
  group: named-ui-tunnel-${{ inputs.hostname }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get -o DPkg::Lock::Timeout=60 install -y --no-install-recommends python3-tk
      - uses: ui-test-actions/ui-test-actions@2ef8755b2707f82c048eb6d53cc0426349e60350
        with:
          target: linux
          token-sha256: ${{ inputs.token_sha256 }}
          tunnel-hostname: ${{ inputs.hostname }}
          tunnel-token: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          origin-port: '8787'
          duration-minutes: ${{ inputs.duration }}
          launch: /usr/bin/python3 fixtures/desktop.py fixture-ready > fixture.log 2>&1 &
          ready: test -f fixture-ready
