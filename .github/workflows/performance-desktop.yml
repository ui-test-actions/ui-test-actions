name: Verify native desktop performance metrics
run-name: Desktop performance · ${{ inputs.target }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [linux, windows, macos]
        required: true
      token_sha256:
        description: SHA-256 digest of the external client token
        type: string
        required: true
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ${{ fromJSON('{"linux":"ubuntu-24.04","windows":"windows-2025","macos":"macos-15"}')[inputs.target] }}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux fixture and accessibility packages
        if: inputs.target == 'linux'
        run: sudo apt-get -o DPkg::Lock::Timeout=60 install -y --no-install-recommends python3-tk python3-pyatspi at-spi2-core dbus-x11
      - uses: ui-test-actions/ui-test-actions@ca3d59b9a5ae10832ae00320bace38e4f65e3367
        with:
          target: ${{ inputs.target }}
          token-sha256: ${{ inputs.token_sha256 }}
          duration-minutes: '6'
          display-size: 1024x768
          desktop-apps: >-
            {"owned-fixture":{"argv":["${{ inputs.target == 'linux' && '/usr/bin/python3' || 'python' }}","fixtures/desktop.py","owned-fixture-ready","35"]}}
          launch: |
            python_bin=python
            if [[ "$RUNNER_OS" == Linux ]]; then python_bin=/usr/bin/python3; fi
            "$python_bin" fixtures/desktop.py fixture-ready > fixture.log 2>&1 &
          ready: test -f fixture-ready
