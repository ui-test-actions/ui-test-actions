name: Verify a Flutter application settings journey
on:
  workflow_dispatch:
    inputs:
      token_sha256:
        description: SHA-256 digest of the external client token
        required: true
        type: string
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare the pinned Flutter release
        shell: bash
        run: |
          app="$RUNNER_TEMP/localsend"
          mkdir -p "$app" "$RUNNER_TEMP/localsend-settings" flutter-evidence
          python - "$app" <<'PY'
          import hashlib, json, pathlib, sys, urllib.request
          pins = json.loads(pathlib.Path("verification/real-apps/apps.json").read_text())["linux-flutter"]
          asset = pathlib.Path(sys.argv[1]) / "localsend.tar.gz"
          url = f'https://github.com/{pins["repository"]}/releases/download/{pins["ref"]}/{pins["asset"]}'
          urllib.request.urlretrieve(url, asset)
          with asset.open("rb") as stream:
              if hashlib.file_digest(stream, "sha256").hexdigest() != pins["sha256"]:
                  raise SystemExit("LocalSend release checksum mismatch")
          PY
          tar -xzf "$app/localsend.tar.gz" -C "$app"
          executable=$(find "$app" -name localsend_app -type f -print -quit)
          test -x "$executable"
          echo "FLUTTER_APP=$executable" >> "$GITHUB_ENV"
          sudo apt-get -o DPkg::Lock::Timeout=60 install -y --no-install-recommends \
            fonts-noto-core libgtk-3-0t64 libayatana-appindicator3-1 libegl1 libegl-mesa0 libgl1 libopengl0
      - uses: ui-test-actions/ui-test-actions@803d83d50713f845db414c30c7c826071ede907c
        with:
          target: linux
          token-sha256: ${{ inputs.token_sha256 }}
          duration-minutes: '15'
          launch: |
            XDG_CONFIG_HOME="$RUNNER_TEMP/localsend-settings" LIBGL_ALWAYS_SOFTWARE=1 \
              "$FLUTTER_APP" > flutter-evidence/app.log 2>&1 &
            app_pid=$!
            printf '%s\n' "$app_pid" > flutter-evidence/app.pid
            sleep 2
            kill -0 "$app_pid" || { cat flutter-evidence/app.log >&2; exit 1; }
          ready: |
            kill -0 "$(cat flutter-evidence/app.pid)"
            wmctrl -l | grep -qi localsend
      - name: Assert saved Flutter settings
        shell: bash
        run: |
          python - "$RUNNER_TEMP/localsend-settings" <<'PY'
          import json, pathlib, sys
          for candidate in pathlib.Path(sys.argv[1]).rglob("shared_preferences.json"):
              preferences = json.loads(candidate.read_text())
              selected = {key.rsplit(".", 1)[-1]: value for key, value in preferences.items()}
              if selected.get("ls_alias") == "مختبر UI ١٢٣ 🌍" and str(selected.get("ls_locale")).split("-")[0] == "ar":
                  result = {"app": "LocalSend", "alias": selected["ls_alias"], "locale": selected["ls_locale"], "result": "passed"}
                  pathlib.Path("flutter-evidence/persistence.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n")
                  break
          else:
              raise SystemExit("LocalSend did not persist the expected alias and Arabic locale")
          PY
      - name: Retain Flutter evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flutter-real-app
          path: flutter-evidence/
          if-no-files-found: ignore
          retention-days: 7
