name: Fast automation regressions
on:
  push:
    paths: ['*.py', 'tests/**', 'mobile_ime/**', 'verification/mobile-lan/*.py', 'verification/mobile-lan/*.c', '.github/workflows/tests.yml', 'action.yml']
  pull_request:
    paths: ['*.py', 'tests/**', 'mobile_ime/**', 'verification/mobile-lan/*.py', 'verification/mobile-lan/*.c', '.github/workflows/tests.yml', 'action.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.2.0
      - run: python -m unittest discover -s tests -v
      - name: Test mobile LAN relay and packet filtering
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python -m pip install websockets==15.0.1
          python -m unittest discover -s verification/mobile-lan -v
          cc -Wall -Wextra -Werror -fsyntax-only verification/mobile-lan/frame-port.c
