name: Diagnose Quick Tunnel readiness from hosted runners
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare Python and curl against the same ephemeral HTTPS origin
        run: |
          python verification/transports/diagnose-quick.py > quick-probe.log 2>&1 &
          printf '%s\n' "$!" > quick-probe.pid
          for ((second=0; second<130; second++)); do
            [[ -s "$RUNNER_TEMP/quick-provider-probe/origin" ]] && exit 0
            kill -0 "$(cat quick-probe.pid)" || break
            sleep 1
          done
          cat quick-probe.log
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quick-probe-${{ matrix.runner }}
          path: ${{ runner.temp }}/quick-provider-probe/origin
          retention-days: 1
      - name: Print synthetic diagnostic outcomes
        run: |
          for ((second=0; second<180; second++)); do
            kill -0 "$(cat quick-probe.pid)" || break
            sleep 1
          done
          cat quick-probe.log
