name: Live UI test session
description: Open an authenticated, temporary UI test session on a GitHub-hosted runner
inputs:
  target:
    description: linux, windows, macos, android, or ios
    required: true
  token-sha256:
    description: SHA-256 hex digest of a fresh 256-bit session token held by the client
    required: true
  duration-minutes:
    description: Minutes to keep the session open after readiness (1–180)
    default: '15'
  launch:
    description: Bash script that starts the app and returns, or an empty string to attach
    default: ''
  ready:
    description: Bash command that succeeds once the application is ready
    default: ''
  startup-timeout-seconds:
    description: Maximum time to launch the app and pass its readiness check
    default: '180'
  device:
    description: ADB serial or iOS simulator UDID, or empty to use the only attached/booted device
    default: ''
  app-ids:
    description: Comma-separated application identifiers approved for lifecycle operations
    default: ''
  app-installs:
    description: JSON mapping approved application identifiers to local build artifacts
    default: '{}'
  deeplink-schemes:
    description: Comma-separated deep-link schemes approved by the workflow
    default: ''
  android-ime:
    description: Enable the temporary Unicode input method on an Android emulator
    default: '1'
  file-exchange:
    description: Enable the private, bounded file exchange on a desktop runner
    default: '0'
  tunnel-hostname:
    description: Optional hostname of a dedicated remotely managed Cloudflare Tunnel
    default: ''
  tunnel-token:
    description: Optional GitHub secret containing the remotely managed tunnel connector token
    default: ''
  origin-port:
    description: Fixed loopback origin port configured for a named tunnel
    default: '8787'
runs:
  using: composite
  steps:
    - name: Open UI session
      id: start
      shell: bash
      env:
        UI_TEST_ACTION_PATH: ${{ github.action_path }}
        UI_TEST_TARGET: ${{ inputs.target }}
        UI_TEST_TOKEN_SHA256: ${{ inputs.token-sha256 }}
        UI_TEST_DURATION: ${{ inputs.duration-minutes }}
        UI_TEST_LAUNCH: ${{ inputs.launch }}
        UI_TEST_READY: ${{ inputs.ready }}
        UI_TEST_STARTUP_TIMEOUT: ${{ inputs.startup-timeout-seconds }}
        UI_TEST_DEVICE: ${{ inputs.device }}
        UI_TEST_APP_IDS: ${{ inputs.app-ids }}
        UI_TEST_APP_INSTALLS: ${{ inputs.app-installs }}
        UI_TEST_DEEPLINK_SCHEMES: ${{ inputs.deeplink-schemes }}
        UI_TEST_ANDROID_IME: ${{ inputs.android-ime }}
        UI_TEST_FILE_EXCHANGE: ${{ inputs.file-exchange }}
        UI_TEST_TUNNEL_HOSTNAME: ${{ inputs.tunnel-hostname }}
        UI_TEST_TUNNEL_TOKEN: ${{ inputs.tunnel-token }}
        UI_TEST_ORIGIN_PORT: ${{ inputs.origin-port }}
        PYTHONUNBUFFERED: '1'
      run: |
        UI_TEST_BASH="$BASH"
        if [[ "$RUNNER_OS" == Windows ]]; then UI_TEST_BASH="$(cygpath -aw "$BASH")"; fi
        export UI_TEST_BASH
        python "$UI_TEST_ACTION_PATH/lifecycle.py" start
    - name: Publish live connection
      id: publish
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ui-session-${{ github.job }}-${{ github.run_attempt }}-${{ steps.start.outputs.session-id }}
        path: ${{ steps.start.outputs.file }}
        if-no-files-found: error
        retention-days: 1
    - name: Hold UI session open
      if: success() && steps.start.outcome == 'success'
      shell: bash
      env:
        UI_TEST_ACTION_PATH: ${{ github.action_path }}
        UI_TEST_DURATION: ${{ inputs.duration-minutes }}
        UI_TEST_CONNECTION_FILE: ${{ steps.start.outputs.file }}
        UI_TEST_PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
      run: python "$UI_TEST_ACTION_PATH/lifecycle.py" hold
