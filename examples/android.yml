name: Interactive Android test
on:
  workflow_dispatch:
    inputs:
      token_sha256:
        description: SHA-256 digest of the locally generated session token
        type: string
        required: true
permissions:
  contents: read
jobs:
  interactive:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build the APK
        run: ./gradlew :app:assembleDebug # Adjust for your project.
      - name: Boot Android emulator
        shell: bash
        run: |
          sudo chmod a+rw /dev/kvm
          image='system-images;android-35;google_apis;x86_64'
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$tools/sdkmanager" emulator "$image"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/live-ui-avds"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          adb version
          adb start-server
          echo no | "$tools/avdmanager" create avd --force --name interactive --package "$image" --path "$ANDROID_AVD_HOME/interactive.avd"
          if ! "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fxq interactive; then
            "$tools/avdmanager" list avd
            exit 1
          fi
          "$ANDROID_HOME/emulator/emulator" -avd interactive -port 5554 -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
          emulator_pid=$!
          if ! timeout 360 bash -c 'until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do kill -0 "$1" || exit 1; sleep 2; done' bash "$emulator_pid"; then
            cat emulator.log
            exit 1
          fi
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          adb -s emulator-5554 shell wm dismiss-keyguard
      - uses: ui-test-actions/ui-test-actions@af3c8d69a98c90a15c39055be1b019d82e5ce307
        with:
          target: android
          device: emulator-5554
          token-sha256: ${{ inputs.token_sha256 }}
          duration-minutes: '60'
          launch: |
            adb -s emulator-5554 install -r app/build/outputs/apk/debug/app-debug.apk
            adb -s emulator-5554 shell am start -W -n com.example.app/.MainActivity
          ready: adb -s emulator-5554 shell dumpsys activity activities | grep -q 'topResumedActivity.*com.example.app'
