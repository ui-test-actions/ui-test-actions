name: Interactive iOS test
on:
  workflow_dispatch:
    inputs:
      token_sha256:
        description: SHA-256 digest of the locally generated session token
        type: string
        required: true
permissions:
  contents: read
jobs:
  interactive:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build the simulator app
        shell: bash
        run: |
          xcodebuild -scheme MyApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Boot an iPhone simulator
        shell: bash
        run: |
          xcrun simctl list devices available -j > simulators.json
          simulator=$(python -c '
          import json
          runtimes = json.load(open("simulators.json"))["devices"]
          print(next(
              device["udid"]
              for key in reversed(sorted(runtimes)) if ".iOS-" in key
              for device in runtimes[key]
              if device["name"].startswith("iPhone") and device["isAvailable"]
          ))
          ')
          xcrun simctl bootstatus "$simulator" -b
          echo "UI_DEVICE=$simulator" >> "$GITHUB_ENV"
      - uses: ui-test-actions/ui-test-actions@v3.0.1
        with:
          target: ios
          device: ${{ env.UI_DEVICE }}
          token-sha256: ${{ inputs.token_sha256 }}
          duration-minutes: '60'
          app-ids: com.example.app
          app-installs: '{"com.example.app":"build/Build/Products/Debug-iphonesimulator/MyApp.app"}'
          launch: |
            xcrun simctl install "$UI_DEVICE" build/Build/Products/Debug-iphonesimulator/MyApp.app
            xcrun simctl launch "$UI_DEVICE" com.example.app
          ready: xcrun simctl spawn "$UI_DEVICE" launchctl list | grep -q 'UIKitApplication:com.example.app'
